name: SpeedShare Manual Platform Build Pipeline

on:
  workflow_dispatch: # Manual trigger only (does NOT run automatically on push)
    inputs:
      platform:
        description: "Select platform to build"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - windows
          - linux
          - macos
          - all
      custom_version:
        description: "Override version (e.g. 1.2.2+17). Leave blank to use pubspec.yaml"
        required: false
        default: ""

permissions:
  contents: write # Grants permission to commit & push built installers back to repository

jobs:
  # -------------------------------------------------------------
  # 1. ANDROID BUILD (.apk & .aab)
  # -------------------------------------------------------------
  build-android:
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all'
    name: Build Android Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.custom_version }}"
          else
            RAW_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          fi
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d '+' -f 1)
          BUILD_NUMBER=$(echo "$RAW_VERSION" | cut -s -d '+' -f 2)
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="1"; fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "full_version=${VERSION_NAME}+${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Building SpeedShare Android v${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android APKs and App Bundle
        run: |
          V_NAME="${{ steps.version.outputs.version_name }}"
          B_NUM="${{ steps.version.outputs.build_number }}"
          flutter build appbundle --release --build-name="$V_NAME" --build-number="$B_NUM"
          flutter build apk --release --build-name="$V_NAME" --build-number="$B_NUM"
          flutter build apk --release --split-per-abi --build-name="$V_NAME" --build-number="$B_NUM"
          mkdir -p installers
          cp build/app/outputs/bundle/release/app-release.aab installers/
          cp build/app/outputs/flutter-apk/*.apk installers/

      - name: Upload Android Installers
        uses: actions/upload-artifact@v4
        with:
          name: android-installers
          path: |
            installers/*.apk
            installers/*.aab

  # -------------------------------------------------------------
  # 2. WINDOWS BUILD (.exe & .msix)
  # -------------------------------------------------------------
  build-windows:
    if: github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all'
    name: Build Windows Setup (.exe) & MSIX
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.custom_version }}"
          else
            RAW_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          fi
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d '+' -f 1)
          BUILD_NUMBER=$(echo "$RAW_VERSION" | cut -s -d '+' -f 2)
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="1"; fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "full_version=${VERSION_NAME}+${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Building SpeedShare Windows v${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: |
          $vName = "${{ steps.version.outputs.version_name }}"
          $bNum = "${{ steps.version.outputs.build_number }}"
          flutter build windows --release --build-name=$vName --build-number=$bNum

      - name: Build MSIX Package for Microsoft Store
        run: dart run msix:create --store

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Windows Setup (.exe) and Package (.msix)
        run: |
          $vName = "${{ steps.version.outputs.version_name }}"
          if (!(Test-Path -Path "installers")) { New-Item -ItemType Directory -Path "installers" }
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$vName" inno_setup.iss
          } else {
            iscc /DMyAppVersion="$vName" inno_setup.iss
          }
          Get-ChildItem -Path "build\windows\x64\runner\Release\*.msix" | Copy-Item -Destination "installers/SpeedShare_Windows.msix"

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: installers/*

  # -------------------------------------------------------------
  # 3. LINUX BUILD (.deb)
  # -------------------------------------------------------------
  build-linux:
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'
    name: Build Linux Package (.deb)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.custom_version }}"
          else
            RAW_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          fi
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d '+' -f 1)
          BUILD_NUMBER=$(echo "$RAW_VERSION" | cut -s -d '+' -f 2)
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="1"; fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "full_version=${VERSION_NAME}+${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Building SpeedShare Linux v${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Install Linux build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux Debian Package
        run: |
          chmod +x installers/create_linux_installer.sh
          bash installers/create_linux_installer.sh "${{ steps.version.outputs.version_name }}" "${{ steps.version.outputs.build_number }}"

      - name: Upload Linux Installer
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: installers/*.deb

  # -------------------------------------------------------------
  # 4. MACOS BUILD (.dmg)
  # -------------------------------------------------------------
  build-macos:
    if: github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all'
    name: Build macOS Disk Image (.dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.custom_version }}"
          else
            RAW_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          fi
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d '+' -f 1)
          BUILD_NUMBER=$(echo "$RAW_VERSION" | cut -s -d '+' -f 2)
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="1"; fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Building SpeedShare macOS v${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build macOS Application
        run: |
          flutter build macos --release --build-name="${{ steps.version.outputs.version_name }}" --build-number="${{ steps.version.outputs.build_number }}"

      - name: Create macOS DMG
        run: |
          mkdir -p installers
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: macOS .app bundle not found!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          hdiutil create -volname "Speed Share" -srcfolder "$APP_PATH" -ov -format UDZO "installers/Speed Share.dmg"

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: installers/Speed Share.dmg

  # -------------------------------------------------------------
  # 5. IOS BUILD (.ipa)
  # -------------------------------------------------------------
  build-ios:
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all'
    name: Build iOS Application (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.custom_version }}"
          else
            RAW_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          fi
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d '+' -f 1)
          BUILD_NUMBER=$(echo "$RAW_VERSION" | cut -s -d '+' -f 2)
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="1"; fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Building SpeedShare iOS v${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS Application
        run: |
          flutter build ios --release --no-codesign --build-name="${{ steps.version.outputs.version_name }}" --build-number="${{ steps.version.outputs.build_number }}"
          mkdir -p installers
          rm -rf Payload
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q "installers/SpeedShare_iOS.ipa" Payload
          rm -rf Payload

      - name: Upload iOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: ios-installer
          path: installers/SpeedShare_iOS.ipa

  # -------------------------------------------------------------
  # 6. COMMIT & PUSH BUILT INSTALLERS BACK TO REPOSITORY
  # -------------------------------------------------------------
  commit-installers:
    name: Push Installers to Repository
    needs: [build-android, build-ios, build-windows, build-linux, build-macos]
    if: always() && !cancelled() && contains(needs.*.result, 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download built installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: download-artifacts

      - name: Copy installer binaries into installers directory
        run: |
          mkdir -p installers
          find download-artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.exe" -o -name "*.deb" -o -name "*.dmg" -o -name "*.ipa" -o -name "*.msix" \) -exec cp -v {} installers/ \;
          ls -la installers/

      - name: Commit and push installers to main branch
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add installers/
          if git diff --staged --quiet; then
            echo "No changes in installers directory."
          else
            git commit -m "build: update installer binaries for platform '${{ github.event.inputs.platform }}' (v${VERSION}) [skip ci]"
            git push origin main
          fi
